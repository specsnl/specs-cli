baseURL = "https://cli.specs.dev/"
languageCode = "en-us"
title = "Specs CLI"

enableRobotsTXT = true
enableGitInfo = true
cleanDestinationDir = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "A general-purpose developer CLI for scaffolding projects from templates."

  [params.navbar]
    logo.path = "logo.svg"
    logo.dark = "logo.svg"
    logo.width = 28
    logo.height = 28

  [params.mermaid]
    enable = true

[[menu.main]]
  identifier = "docs"
  name = "Docs"
  pageRef = "/docs"
  weight = 1

[[menu.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/specsnl/specs-cli"
  weight = 2
  params = { type = "icon", icon = "github" }
