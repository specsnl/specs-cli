name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go/pkg/mod
            ~/.cache/go/build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    uses: specsnl/github-actions/.github/workflows/build-go-cli.yml@2.4.2
    with:
      runs-on: ${{ matrix.runner.os }}
      platform: ${{ matrix.runner.platform }}
      image-name: ghcr.io/specsnl/specs-cli
      target: debian
      version-build-arg: SPECS_VERSION

  image-manifest:
    needs: image
    permissions:
      contents: read
      packages: write
    uses: specsnl/github-actions/.github/workflows/merge-go-cli.yml@2.4.2
    with:
      runs-on: ubuntu-24.04
      image-name: ghcr.io/specsnl/specs-cli
      target: debian
