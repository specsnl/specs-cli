volumes:
  cache:

services:
  volume-init:
    image: busybox:1.37.0-musl
    user: root
    volumes:
      - cache:/cache
    command:
      - sh
      - -c
      - |
        mkdir -p /cache/go-build
        mkdir -p /cache/go-mod
        mkdir -p /cache/golangci-lint
        mkdir -p /cache/npm
        chown -R ${FIXUID:-1000}:${FIXGID:-1000} /cache

  go-builder:
    profiles: ["build"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: Dockerfile
      target: builder-download
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - .:/src
      - cache:/cache

  go-binary:
    profiles: ["build"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: Dockerfile
      target: export
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - cache:/cache

  goreleaser:
    profiles: ["build"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    # Latest version: https://hub.docker.com/r/goreleaser/goreleaser/tags
    image: goreleaser/goreleaser:v2.18.1
    working_dir: /src
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - .:/src
      - cache:/cache

  hugo:
    profiles: ["docs"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    # Latest version: https://hub.docker.com/r/hugomods/hugo/tags
    image: hugomods/hugo:debian-go-git-non-root-0.161.1
    working_dir: /src/docs
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    volumes:
      - .:/src
      - cache:/cache
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "1313:1313"

  docs-preview:
    profiles: ["docs"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    image: nginx:alpine
    volumes:
      - ./docs/public:/usr/share/nginx/html:ro
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  node:
    profiles: ["markdown"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    # Latest version: https://hub.docker.com/_/node/tags
    image: node:24.15.0-bookworm
    working_dir: /src
    environment:
      NPM_CONFIG_CACHE: /cache/npm
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - .:/src
      - cache:/cache

  vhs:
    profiles: ["demo"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: Dockerfile
      target: vhs
    working_dir: /src/docs/demo
    environment:
      HOME: /tmp
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    volumes:
      - .:/src
      - ./dev:/usr/local/bin:ro
      - /tmp/specs-demo:/tmp/specs-demo

  bats:
    profiles: ["image"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: Dockerfile
      target: bats
    # Mounted at its own host path, and TMPDIR likewise: the tests run docker
    # through the proxy, so the daemon resolves their bind mounts on the host.
    # A container-only path would not exist there.
    working_dir: ${PWD}
    environment:
      HOME: /tmp
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      TMPDIR: /tmp/specs-image-smoke
    depends_on:
      - docker-socket-proxy
    volumes:
      - ${PWD}:${PWD}
      - /tmp/specs-image-smoke:/tmp/specs-image-smoke

  docker-socket-proxy:
    profiles: ["demo", "image"]
    # Latest version: https://hub.docker.com/r/tecnativa/docker-socket-proxy/tags
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      ALLOW_START: 1
      ALLOW_STOP: 1
      CONTAINERS: 1
      DISTRIBUTION: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      POST: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  hadolint:
    profiles: ["lint"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    # Latest version: https://hub.docker.com/r/hadolint/hadolint/tags
    image: hadolint/hadolint:v2.14.0
    working_dir: /src
    volumes:
      - .:/src

  golangci-lint:
    profiles: ["lint"]
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    # Latest version: https://hub.docker.com/r/golangci/golangci-lint/tags
    image: golangci/golangci-lint:v2.12.2-alpine
    working_dir: /src
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      GOLANGCI_LINT_CACHE: /cache/golangci-lint
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - .:/src
      - cache:/cache
